name: Build and release Rufox for Android

on:
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC. Check on five fixed dates each month. A release that
    # already exists for the current Firefox version is skipped before the build.
    - cron: "0 23 * * *"

permissions:
  contents: read

concurrency:
  group: ruthenium-firefox-stable-android-${{ github.event.pull_request.number || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  resolve:
    name: Resolve current Firefox release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      archive_url: ${{ steps.source.outputs.archive_url }}
      release_exists: ${{ steps.release.outputs.exists }}
      release_tag: ${{ steps.release.outputs.tag }}
      repository: ${{ steps.source.outputs.repository }}
      revision: ${{ steps.source.outputs.revision }}
      tag: ${{ steps.source.outputs.tag }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve latest stable Firefox Android source
        id: source
        run: python3 scripts/resolve_firefox_source.py --format github-output >> "$GITHUB_OUTPUT"

      - name: Skip a Firefox version that was already published
        id: release
        env:
          FIREFOX_VERSION: ${{ steps.source.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="${FIREFOX_VERSION}_debug"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          set +e
          response="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$release_tag" 2>&1)"
          status=$?
          set -e
          if [[ "$status" -eq 0 ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $release_tag already exists; no build is required."
          elif grep -Fq "HTTP 404" <<< "$response"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Could not determine whether release $release_tag exists."
            printf '%s\n' "$response" >&2
            exit "$status"
          fi

  build:
    name: Build Rufox ${{ needs.resolve.outputs.version }} (${{ matrix.abi }})
    needs: resolve
    # Scheduled checks skip versions that are already published. A manual run
    # intentionally rebuilds the current version so broken release assets can
    # be replaced after a CI fix.
    if: needs.resolve.outputs.release_exists != 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android
          - abi: armeabi-v7a
            target: arm-linux-androideabi
          - abi: x86_64
            target: x86_64-linux-android
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      MOZ_OBJDIR_NAME: obj-ruthenium-${{ matrix.abi }}
      RFIREFOX_DEBUG_CERT_SHA256: d7a19050129bbb6e7af6f29dc899a123757ca226ea0ee3c7395c43527592035f
      RFIREFOX_TARGET: ${{ matrix.target }}
      RFIREFOX_TARGET_ABI: ${{ matrix.abi }}
      TARGET_ABI: ${{ matrix.abi }}
    steps:
      - uses: actions/checkout@v4

      - name: Set build paths
        run: |
          echo "FIREFOX_SOURCE_DIR=$RUNNER_TEMP/firefox-source" >> "$GITHUB_ENV"
          echo "MOZCONFIG=$RUNNER_TEMP/firefox-source/mozconfig" >> "$GITHUB_ENV"
          echo "RFIREFOX_DEBUG_KEYSTORE=$GITHUB_WORKSPACE/signing/rfirefox-debug.keystore" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=" >> "$GITHUB_ENV"

      - name: Verify the repository debug key
        run: |
          test -f "$RFIREFOX_DEBUG_KEYSTORE"
          fingerprint="$(
            keytool -list -v \
              -keystore "$RFIREFOX_DEBUG_KEYSTORE" \
              -storepass android \
              -alias androiddebugkey |
              sed -n 's/^[[:space:]]*SHA256: //p' |
              tr -d ':' |
              tr '[:upper:]' '[:lower:]'
          )"
          test "$fingerprint" = "$RFIREFOX_DEBUG_CERT_SHA256"

      - name: Free space on the ephemeral GitHub runner
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf -- \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install --yes mercurial unzip

      - name: Cache Mozilla toolchains and Gradle downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.mozbuild
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: firefox-android-${{ matrix.abi }}-v3-${{ runner.os }}-${{ needs.resolve.outputs.revision }}
          restore-keys: |
            firefox-android-${{ matrix.abi }}-v3-${{ runner.os }}-

      - name: Download the exact stable source archive
        env:
          ARCHIVE_URL: ${{ needs.resolve.outputs.archive_url }}
          EXPECTED_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          archive="$RUNNER_TEMP/firefox-source.zip"
          unpacked="$RUNNER_TEMP/firefox-unpacked"
          curl --fail --location --show-error \
            --retry 5 --retry-all-errors \
            --connect-timeout 30 \
            --output "$archive" \
            "$ARCHIVE_URL"
          mkdir -p "$unpacked"
          unzip -q "$archive" -d "$unpacked"
          source_root="$(find "$unpacked" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$source_root"
          mv "$source_root" "$FIREFOX_SOURCE_DIR"
          test "$(tr -d '\r\n' < "$FIREFOX_SOURCE_DIR/browser/config/version.txt")" = "$EXPECTED_VERSION"
          rm -f -- "$archive"

      - name: Verify and apply Ruthenium patches
        run: python3 scripts/patch_firefox.py --source "$FIREFOX_SOURCE_DIR"

      - name: Bootstrap GeckoView and Fenix toolchains
        working-directory: ${{ runner.temp }}/firefox-source
        env:
          RFIREFOX_BOOTSTRAP_HEARTBEAT_SECONDS: "60"
        run: |
          # Mozilla stores the downloaded NDK archive under mozboot, but unzip
          # extracts it with ~/.mozbuild as its working directory. A restored
          # android-ndk-r29 directory therefore triggers an interactive replace
          # prompt and EOF even when mozboot itself was removed.
          # Both paths are disposable on this fixed-home GitHub-hosted runner.
          test "$HOME" = "/home/runner"
          rm -rf -- \
            /home/runner/.mozbuild/mozboot \
            /home/runner/.mozbuild/android-ndk-r29
          bash "$GITHUB_WORKSPACE/scripts/run_bootstrap_with_heartbeat.sh"
          test -f "$MOZCONFIG"
          # GNU config.guess identifies the x86_64 runner as
          # x86_64-pc-linux-gnu, while Rust uses x86_64-unknown-linux-gnu.
          # New Rust releases can expose several compatible GNU/Linux targets,
          # so Firefox may not be able to infer the Rust host unambiguously.
          # Normalize the build host explicitly, then select this matrix job's
          # Android target as before.
          sed -i -E \
            -e '/^[[:space:]]*ac_add_options[[:space:]]+--host=/d' \
            -e '/^[[:space:]]*ac_add_options[[:space:]]+--target=/d' \
            "$MOZCONFIG"
          {
            echo "mk_add_options MOZ_OBJDIR=@TOPSRCDIR@/$MOZ_OBJDIR_NAME"
            echo "ac_add_options --host=x86_64-unknown-linux-gnu"
            echo "ac_add_options --target=$RFIREFOX_TARGET"
            echo "ac_add_options --enable-release"
            echo "ac_add_options --disable-debug"
            echo "ac_add_options --disable-debug-symbols"
            echo "ac_add_options --enable-optimize"
          } >> "$MOZCONFIG"
          test "$(grep -Ec '^[[:space:]]*ac_add_options[[:space:]]+--host=' "$MOZCONFIG")" -eq 1
          test "$(grep -Ec '^[[:space:]]*ac_add_options[[:space:]]+--target=' "$MOZCONFIG")" -eq 1
          grep -F "ac_add_options --host=x86_64-unknown-linux-gnu" "$MOZCONFIG"
          grep -F "ac_add_options --target=$RFIREFOX_TARGET" "$MOZCONFIG"

      - name: Upload bootstrap diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-diagnostics-${{ matrix.abi }}-${{ needs.resolve.outputs.version }}-${{ github.run_id }}
          path: ${{ runner.temp }}/rfirefox-bootstrap/
          if-no-files-found: warn
          retention-days: 7

      - name: Build patched GeckoView
        working-directory: ${{ runner.temp }}/firefox-source
        run: ./mach build

      - name: Stop GeckoView Gradle daemons before Fenix packaging
        working-directory: ${{ runner.temp }}/firefox-source
        run: |
          ./gradlew --stop
          ./gradlew --status || true
          free -h

      - name: Assemble Fenix release APK with the debug key
        working-directory: ${{ runner.temp }}/firefox-source
        # The Rufox product patch points signingConfigs.debug to the
        # RFIREFOX_DEBUG_KEYSTORE file committed in this repository.
        # A full mach build has just refreshed and staged Gecko. Tell Mozilla's
        # Gradle plugin not to start a nested `mach build faster`, which would
        # keep a second 7 GiB Gradle daemon alive during the memory-heavy R8
        # and resource-shrinking tasks on a 16 GiB hosted runner.
        env:
          GRADLE_INVOKED_WITHIN_MACH_BUILD: "1"
        run: ./mach gradle --no-daemon --max-workers=2 fenix:assembleRelease

      - name: Collect and verify the ${{ matrix.abi }} APK
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
        run: |
          output_dir="$FIREFOX_SOURCE_DIR/$MOZ_OBJDIR_NAME/gradle/build/mobile/android/fenix/app/outputs/apk/release"
          artifact_dir="$GITHUB_WORKSPACE/artifacts-$TARGET_ABI"
          mkdir -p "$artifact_dir"

          apksigner="$(find ~/.mozbuild -type f -name apksigner -print | sort -V | tail -n 1)"
          aapt2="$(find ~/.mozbuild -type f -name aapt2 -print | sort -V | tail -n 1)"
          test -x "$apksigner"
          test -x "$aapt2"

          mapfile -t source_apks < <(
            find "$output_dir" -type f -name "*-$TARGET_ABI-release.apk" -print | sort
          )
          if [[ "${#source_apks[@]}" -ne 1 ]]; then
            echo "::error title=Unexpected APK outputs::Expected one $TARGET_ABI release APK, found ${#source_apks[@]}."
            printf '%s\n' "${source_apks[@]}"
            exit 1
          fi

          source_apk="${source_apks[0]}"
          upstream_name="$(basename "$source_apk" .apk)"
          release_name="Rufox-$RELEASE_TAG-$upstream_name.apk"
          release_apk="$artifact_dir/$release_name"
          cp -- "$source_apk" "$release_apk"

          # This is the regression guard that the previous workflow lacked:
          # the ABI split must contain a real Gecko engine for the same ABI.
          python3 "$GITHUB_WORKSPACE/scripts/verify_android_apk.py" \
            --apk "$release_apk" \
            --abi "$TARGET_ABI"

          signer_info="$("$apksigner" verify --verbose --print-certs "$release_apk")"
          printf '%s\n' "$signer_info"
          signer_sha256="$(
            printf '%s\n' "$signer_info" |
              python3 "$GITHUB_WORKSPACE/scripts/parse_apksigner_output.py"
          )"
          if [[ "$signer_sha256" != "$RFIREFOX_DEBUG_CERT_SHA256" ]]; then
            echo "::error title=Unexpected APK signing certificate::Expected $RFIREFOX_DEBUG_CERT_SHA256, got $signer_sha256."
            exit 1
          fi

          if ! badging="$("$aapt2" dump badging "$release_apk")"; then
            printf '%s\n' "$badging"
            echo "::error title=Could not inspect APK metadata::aapt2 dump badging failed for $release_name."
            exit 1
          fi
          printf '%s\n' "$badging" | sed -n \
            -e '/^package:/p' \
            -e '/^application-label:/p' \
            -e '/^native-code:/p'
          if ! grep -Fq "package: name='app.ruthenium.firefox'" <<< "$badging"; then
            echo "::error title=Unexpected APK application ID::Expected app.ruthenium.firefox."
            exit 1
          fi
          if ! grep -Fq "application-label:'Rufox'" <<< "$badging"; then
            echo "::error title=Unexpected APK label::Expected Rufox."
            exit 1
          fi
          if ! grep -Fq "native-code: '$TARGET_ABI'" <<< "$badging"; then
            echo "::error title=Unexpected APK native code::Expected only $TARGET_ABI."
            exit 1
          fi
          (cd "$artifact_dir" && sha256sum "$release_name") > "$release_apk.sha256"

      - name: Upload the ${{ matrix.abi }} APK
        uses: actions/upload-artifact@v4
        with:
          name: rufox-apk-${{ matrix.abi }}
          path: artifacts-${{ matrix.abi }}/
          if-no-files-found: error
          retention-days: 2

  publish:
    name: Verify and publish Rufox ${{ needs.resolve.outputs.version }}
    needs: [resolve, build]
    if: ${{ always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.resolve.result == 'success' && needs.build.result == 'success' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download all ABI APKs
        uses: actions/download-artifact@v4
        with:
          pattern: rufox-apk-*
          path: artifacts/
          merge-multiple: true

      - name: Verify all release APKs
        run: |
          expected_abis=(arm64-v8a armeabi-v7a x86_64)
          mapfile -t apks < <(find artifacts -maxdepth 1 -type f -name '*.apk' -print | sort)
          if [[ "${#apks[@]}" -ne "${#expected_abis[@]}" ]]; then
            echo "::error title=Incomplete Rufox release::Expected ${#expected_abis[@]} APKs, found ${#apks[@]}."
            printf '%s\n' "${apks[@]}"
            exit 1
          fi

          for abi in "${expected_abis[@]}"; do
            mapfile -t abi_apks < <(
              find artifacts -maxdepth 1 -type f -name "*-$abi-release.apk" -print | sort
            )
            if [[ "${#abi_apks[@]}" -ne 1 ]]; then
              echo "::error title=Unexpected Rufox release::Expected one $abi APK, found ${#abi_apks[@]}."
              printf '%s\n' "${abi_apks[@]}"
              exit 1
            fi
            release_apk="${abi_apks[0]}"
            python3 scripts/verify_android_apk.py --apk "$release_apk" --abi "$abi"
            (cd artifacts && sha256sum --check "$(basename "$release_apk").sha256")
          done

      - name: Write release metadata
        env:
          FIREFOX_VERSION: ${{ needs.resolve.outputs.version }}
          FIREFOX_REVISION: ${{ needs.resolve.outputs.revision }}
          FIREFOX_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          RFIREFOX_DEBUG_CERT_SHA256: d7a19050129bbb6e7af6f29dc899a123757ca226ea0ee3c7395c43527592035f
        run: |
          cat > artifacts/build-info.txt <<EOF
          Product: Rufox
          Firefox version: $FIREFOX_VERSION
          Firefox Android tag: $FIREFOX_TAG
          Mozilla revision: $FIREFOX_REVISION
          Release tag: $RELEASE_TAG
          Application ID: app.ruthenium.firefox
          ABIs: arm64-v8a, armeabi-v7a, x86_64
          Gecko native libraries: independently built and verified for every ABI
          Signing: public repository Android debug key
          Signing certificate SHA-256: $RFIREFOX_DEBUG_CERT_SHA256
          Protected CA policy: .ru,.xn--p1ai,.su plus Yandex SCT; user exceptions supported
          IP subjectAltName values: rejected
          Ministry CA DER SHA-256: d26d2d0231b7c39f92cc738512ba54103519e4405d68b5bd703e9788ca8ecf31
          EOF

          {
            echo "Rufox $RELEASE_TAG"
            echo
            echo "Three debug-signed installable APKs built from Mozilla tag $FIREFOX_TAG."
            echo
            echo "- Mozilla revision: $FIREFOX_REVISION"
            echo "- Android application ID: app.ruthenium.firefox"
            echo "- ABIs: arm64-v8a, armeabi-v7a, x86_64"
            echo "- Gecko native libraries are independently built and verified for every ABI"
            echo "- Public debug signer SHA-256: $RFIREFOX_DEBUG_CERT_SHA256"
            echo "- Protected CA policy: .ru/.su/.рф and Yandex SCT by default; user-controlled exceptions"
            echo
            echo "Warning: the debug private key is public and does not authenticate the publisher."
            echo
            echo "Verify the APK with the adjacent .sha256 file before installation."
          } > artifacts/release-notes.md

      - name: Upload debug-signed build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rufox-${{ needs.resolve.outputs.release_tag }}
          path: |
            artifacts/*.apk
            artifacts/*.apk.sha256
            artifacts/build-info.txt
            artifacts/release-notes.md
          if-no-files-found: error
          retention-days: 14

      - name: Publish or replace GitHub Release
        env:
          RELEASE_EXISTS: ${{ needs.resolve.outputs.release_exists }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          retry_gh() {
            local attempt=1
            local max_attempts=5
            local delay_seconds=10
            local status

            while true; do
              if "$@"; then
                return 0
              else
                status=$?
              fi
              if (( attempt >= max_attempts )); then
                echo "::error::GitHub CLI command failed after $attempt attempts: $*"
                return "$status"
              fi
              echo "::warning::GitHub CLI command failed on attempt $attempt/$max_attempts; retrying in ${delay_seconds}s: $*"
              sleep "$delay_seconds"
              attempt=$((attempt + 1))
              delay_seconds=$((delay_seconds * 2))
            done
          }

          edit_release() {
            retry_gh gh release edit "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" \
              --notes-file artifacts/release-notes.md
          }

          if [[ "$RELEASE_EXISTS" == "true" ]]; then
            edit_release
          else
            release_ready=false
            attempt=1
            max_attempts=5
            delay_seconds=10
            create_status=1

            while (( attempt <= max_attempts )); do
              if gh release create "$RELEASE_TAG" \
                --target "$GITHUB_SHA" \
                --title "$RELEASE_TAG" \
                --notes-file artifacts/release-notes.md; then
                release_ready=true
                break
              else
                create_status=$?
              fi

              # A request can reach GitHub even when the runner receives a
              # transient error. Treat an observable release as success.
              if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
                release_ready=true
                break
              fi
              if (( attempt >= max_attempts )); then
                break
              fi
              echo "::warning::Release creation failed on attempt $attempt/$max_attempts; retrying in ${delay_seconds}s."
              sleep "$delay_seconds"
              attempt=$((attempt + 1))
              delay_seconds=$((delay_seconds * 2))
            done

            if [[ "$release_ready" != "true" ]]; then
              echo "::error::Could not create release $RELEASE_TAG after $max_attempts attempts."
              exit "$create_status"
            fi
            edit_release
          fi

          for asset in artifacts/*.apk artifacts/*.apk.sha256 artifacts/build-info.txt; do
            retry_gh gh release upload "$RELEASE_TAG" "$asset" --clobber
          done
